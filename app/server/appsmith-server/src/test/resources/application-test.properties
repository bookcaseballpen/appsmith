# Embedded MongoDB for JUnit tests; Flapdoodle selects the native OS/CPU build.
de.flapdoodle.mongodb.embedded.version=7.0.34
logging.level.root=error
appsmith.git.root = /dev/shm/git-storage

# GHSA-j9gf-vw2f-9hrw: enable the insecure-compatibility flag in the integration test
# environment so the legacy Origin-based behaviour is preserved across the existing
# Workspace / Fork / UserService / Theme integration suites. The fail-closed semantics
# of the resolver are pinned directly by SecureBaseUrlResolverCEImplTest unit tests;
# production deployments default this flag to false (secure).
APPSMITH_ALLOW_INSECURE_ORIGIN_BASED_LINKS=true

# Fork: the upstream integration suites expect cloud services, so they run with the kill switch on.
# The fork's disabled default is covered by the *Impl unit tests.
appsmith.cloud_services.enabled=true
# Fork: same for the built-in AI; the fork's disabled default is covered by unit tests (BuiltInAiConfigTest and the
# AI *Impl tests).
appsmith.ai.enabled=true
# Fork: same for the built-in Git; the disabled default is covered by HiddenEndpointsWebFilterTest and
# HiddenEndpointsHttpTest.
appsmith.git.enabled=true
# Fork: test runs must never reach Appsmith's cloud. Point both cloud URLs at a closed loopback port, so calls the
# suites don't mock (such as instance registration at start-up) fail locally; suites that need responses set their
# own MockWebServer URL.
appsmith.cloud_services.base_url=http://127.0.0.1:1
appsmith.cloud_services.signature_base_url=http://127.0.0.1:1
# Fork: the upstream suites change apps over HTTP as session users, so they run with the read-only editor off. The
# default (on) is covered by EditorReadOnlyWebFilterTest and EditorReadOnlyHttpTest.
appsmith.editor.read-only=false
