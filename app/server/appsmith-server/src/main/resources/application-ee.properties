spring.config.import=application-ce.properties

# Fork: Appsmith cloud services (cs.appsmith.com) are off unless explicitly enabled. See FORK.md.
appsmith.cloud_services.enabled = ${APPSMITH_CLOUD_SERVICES_ENABLED:false}

# Fork: the built-in AI features are off unless explicitly enabled. MCP is not affected. See FORK.md.
appsmith.ai.enabled = ${APPSMITH_AI_ENABLED:false}

# Fork: Appsmith's built-in Git is off unless explicitly enabled; apps are versioned by export/import. See FORK.md.
appsmith.git.enabled = ${APPSMITH_GIT_ENABLED:false}
